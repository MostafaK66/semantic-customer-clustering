[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "semantic-customer-clustering"
version = "1.0.0"
description = "Reproducible classical, mixed-data, and semantic customer clustering"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "MostafaK66" }]
dependencies = [
  "numpy>=1.26,<2.3",
  "pandas>=2.1,<4",
  "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
semantic = ["sentence-transformers>=3,<6"]
ecod = ["pyod>=2,<3"]
mixed = ["gower>=0.1.2,<1", "kmodes>=0.12,<1"]
plots = ["matplotlib>=3.8,<4"]
all = [
  "sentence-transformers>=3,<6",
  "gower>=0.1.2,<1",
  "kmodes>=0.12,<1",
  "matplotlib>=3.8,<4",
]
dev = [
  "hatchling>=1.27",
  "mypy>=1.15",
  "pandas-stubs>=2.1",
  "pytest>=8.3",
  "pytest-cov>=6",
  "ruff>=0.11",
]

[project.scripts]
customer-clustering = "semantic_customer_clustering.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/semantic_customer_clustering"]

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
show_error_codes = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
  "gower",
  "kmodes.*",
  "matplotlib.*",
  "pyod.*",
  "sentence_transformers.*",
  "sklearn.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov-branch --cov-fail-under=90"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["semantic_customer_clustering"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "if __name__ == .__main__.:"]
